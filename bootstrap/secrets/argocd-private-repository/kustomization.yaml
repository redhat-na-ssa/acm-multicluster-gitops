resources:
  - ../../../components/secrets/argocd_repository
patches:
  - target:
      kind: Secret
      name: replace-me
      namespace: openshift-gitops
    patch: |-
      - op: replace
        path: /metadata/name
        value: replace-me
      - op: replace
        path: /stringData/url
        value: ssh://git@github.com:22/replace-me
