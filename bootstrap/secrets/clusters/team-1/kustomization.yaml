resources:
  - ../../../../components/secrets/cloud_credentials/aws
  - ../../../../components/secrets/installconfig/aws
  - ../../../../components/secrets/pull_secret
patches:
  - target:
      kind: Secret
      name: cloud-creds
      namespace: replace-me
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: cluster-team-1
  - target:
      kind: Secret
      name: installconfig
      namespace: replace-me
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: cluster-team-1
  - target:
      kind: Secret
      name: ocp-pull-secret
      namespace: replace-me
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: cluster-team-1
