resources:
  - ../../components/application
patches:
  - target:
      kind: Application
      name: replace-me
    patch: |-
        - op: replace
          path: /metadata/name
          value: primary-hub
        - op: replace
          path: /spec/source
          value:
            repoURL: https://github.com/redhat-na-ssa/acm-gitops-demo
            targetRevision: main
            path: ./hubs/primary
        - op: replace
          path: /spec/destination/namespace
          value: primary-hub-bootstrap
        - op: add
          path: /spec/syncPolicy/syncOptions/1
          value: SkipDryRunOnMissingResource=true
        - op: add
          path: /spec/syncPolicy/syncOptions/2
          value: RespectIgnoreDifferences=true
        - op: add
          path: /spec/ignoreDifferences
          value:
            - group: cluster.open-cluster-management.io
              kind: ManagedCluster
              jsonPointers:
                - /metadata/labels/cloud
                - /metadata/labels/name
                - /metadata/labels/vendor
            - group: operator.open-cluster-management.io
              kind: MultiClusterHub
              jsonPointers:
                - /spec/overrides/components
            - group: multicluster.openshift.io
              kind: MultiClusterEngine
              jsonPointers:
                - /spec/overrides/components
