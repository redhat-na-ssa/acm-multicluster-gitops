resources:
  - ../../../../../components/applicationset
patches:
  - target:
      kind: ApplicationSet
      name: replace-me
    patch: |-
      - op: replace
        path: /metadata/name
        value: cluster-team-1-config
      - op: replace
        path: /spec/template/metadata/annotations/apps.open-cluster-management.io~1ocm-managed-cluster
        value: cluster-team-1
      - op: replace
        path: /spec/template/metadata/name
        value: cluster-team-1-config
      - op: replace
        path: /spec/template/spec/source
        value:
          repoURL: https://github.com/redhat-na-ssa/acm-gitops-demo
          targetRevision: main
          path: ./cluster_types/type_a
      - op: replace
        path: /spec/generators/0/clusterDecisionResource/labelSelector/matchLabels/cluster.open-cluster-management.io~1placement
        value: aws-gitops-placement
      - op: replace
        path: /spec/template/spec/destination/namespace
        value: cluster-team-1
